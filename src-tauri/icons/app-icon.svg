    <rect x="96" y="96" width="832" height="832" fill="url(#bloom)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#vignette)"/>

    <ellipse cx="512" cy="678" rx="305" ry="27" fill="#04082E" opacity="0.5" filter="url(#soft)"/>

    <g mask="url(#rows)">
      <path d="M 296 482
               L 368 400 Q 379 384 400 384
               L 624 384 Q 645 384 656 400
               L 728 482
               L 824 482 Q 854 482 854 512
               L 854 552
               L 804 602
               L 220 602
               L 170 552
               L 170 512 Q 170 482 200 482
