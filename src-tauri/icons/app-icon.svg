      <g clip-path="url(#carClip)">
        <rect x="160" y="506" width="704" height="64" fill="#3ECBFF" opacity="0.6" filter="url(#glow)"/>
        <rect x="160" y="522" width="704" height="34" fill="url(#accent)"/>
      </g>
    </g>

    <circle cx="352" cy="602" r="54" fill="#0B1046"/>
    <circle cx="352" cy="602" r="9" fill="#C6D3FF"/>
    <circle cx="672" cy="602" r="54" fill="#0B1046"/>
    <circle cx="672" cy="602" r="9" fill="#C6D3FF"/>
