[package]
name = "app"
version = "4.4.8"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.2"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
# 公告删除走系统废纸篓（fs 插件无 trash API）
trash = "5"
# 公告 PDF 批量扫描：walkdir 已在依赖树；嗅探只用 lopdf（轻量模式——pdf-extract
# 对工信部 PDF 100% panic 且 344ms/文件，已按 grilling Q1 裁定移除）
walkdir = "2"
regex = "1"
sha2 = "0.10"
lopdf = "0.42"
calamine = "0.30.1"
rust_xlsxwriter = "0.92.0"
# 手机查看（只读远程面，ADR-0004）：极简 HTTP 服务，只绑 127.0.0.1
tiny_http = "0.12"
base64 = "0.22"
getrandom = "0.2"
percent-encoding = "2"
# 自建中继（alma-relay 协议）：桌面出站 WSS，手机经中继访问 127.0.0.1 服务。
# 中继只转发请求，不新增写路径；本机服务仍只绑回环（ADR-0004）。
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
