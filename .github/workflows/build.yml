name: Build Windows

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - "v*" # 任何v开头的标签触发

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vehicle Parameter Tool ${{ github.ref_name }}"
          releaseBody: |
            ## Vehicle Parameter Tool ${{ github.ref_name }}

            ### 更新内容 (V4.2.0)

            #### 🚀 数据破壁：资产库全链路泵水同步
            - **无缝对接** — 引入背景同步器 `AssetDataSynchronizer`。激活资产时自动从磁盘加载 JSON 到内存，消除数据断层。
            - **资产即数据** — 修复了“待分析列表有车型但在对比/管理中选不到”的问题。

            #### 🏗️ 模组大一统：标准车型选择组件
            - **UI 归一化** — 打造通用的 `ProductSourceSelector` 组件，集成 Select + Tag 实时预览。
            - **全线适配** — 对比、填报、多车型管理三大模块核心交互完全统一。
            - **快捷操作** — 支持“一键全选当前工作集”，大幅提升批量分析效率。

            #### 🔧 其他优化
            - **全流程适配** — 多车型管理模块现已完美支持资产库数据源。
            - **代码质量** — 清理了冗余代码与编译报警。

            ---
            下载 `.msi` 安装程序或 `.exe` 可执行文件。
          releaseDraft: false
          prerelease: false
