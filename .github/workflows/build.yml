name: Build

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main
    tags:
      - "v*" # 任何v开头的标签触发
  pull_request:

jobs:
  # lint + typecheck + test + build：非 tag 的 push / PR 都跑（tag 推送走下面的打包 job）
  #
  # build 必须在这里跑：脚本 `npm run check` 是四步（lint→typecheck→test→build），
  # 而这条 job 的名字就是 main 保护规则要求的那项检查（context "check"）。
  # 少跑 build 时，tsc -b / vite 打包 / 配置层面的错误拦不住，却照样能被判为「绿」——
  # 一旦开了自动合并，等于让没构建过的代码进主干（LESSONS L-7 同类：假绿）。
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # 与本地 `npm run check` 的第四步对齐：tsc -b 全量构建 + vite 打包
      - name: Build
        run: npm run build

  build-windows:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "整车产品工作台 VPW ${{ github.ref_name }}"
          releaseBody: |
            ## 整车产品工作台 VPW ${{ github.ref_name }}

            本次改动见提交历史与设计文档：

            - 提交历史：https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
            - 设计方案：`docs/plans/`

            ---
            下载 `.exe` 安装程序（Windows）或 `.dmg` 磁盘映像（macOS）。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "整车产品工作台 VPW ${{ github.ref_name }}"
          releaseBody: |
            ## 整车产品工作台 VPW ${{ github.ref_name }}

            本次改动见提交历史与设计文档：

            - 提交历史：https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
            - 设计方案：`docs/plans/`

            ---
            下载 `.exe` 安装程序（Windows）或 `.dmg` 磁盘映像（macOS）。
          releaseDraft: false
          prerelease: false
